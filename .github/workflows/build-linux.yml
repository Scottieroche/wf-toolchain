name: build-linux-toolchain

# Builds Chez Scheme + Idris2 for Linux x86_64 into one relocatable prefix,
# proves it runs from a different path in a clean environment, and publishes it
# as a release asset that a sandbox can fetch with plain curl (no credentials).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        default: linux-x86_64-v1
  push:
    tags: ['linux-x86_64-v*']

permissions:
  contents: write

env:
  CHEZ_TAG: v10.1.0
  IDRIS_TAG: v0.7.0
  BUNDLE: wf-toolchain-linux-x86_64-chez10.1.0-idris2-0.7.0

jobs:
  build:
    runs-on: ubuntu-22.04   # glibc 2.35 floor: runs on Ubuntu 22.04+ sandboxes
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies (build time only)
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev libncurses-dev uuid-dev xz-utils git

      - name: Build Chez Scheme from source
        run: |
          P="$RUNNER_TEMP/tools"
          git clone --recurse-submodules --depth 1 --branch "$CHEZ_TAG" https://github.com/cisco/ChezScheme "$RUNNER_TEMP/ChezScheme"
          cd "$RUNNER_TEMP/ChezScheme"
          ./configure --threads --disable-x11 --installprefix="$P/chez"
          make -j"$(nproc)"
          make install
          "$P/chez/bin/scheme" --version

      - name: Build Idris2 with that Chez
        run: |
          P="$RUNNER_TEMP/tools"
          git clone --depth 1 --branch "$IDRIS_TAG" https://github.com/idris-lang/Idris2 "$RUNNER_TEMP/Idris2"
          cd "$RUNNER_TEMP/Idris2"
          make bootstrap SCHEME="$P/chez/bin/scheme" PREFIX="$P/idris2" -j"$(nproc)"
          make install SCHEME="$P/chez/bin/scheme" PREFIX="$P/idris2"
          PATH="$P/chez/bin:$P/idris2/bin:$PATH" idris2 --version

      - name: Make it relocatable
        run: |
          P="$RUNNER_TEMP/tools"
          # The compiled idris2.so carries an absolute '#!<scheme> --program' line; run it through $SCHEME instead.
          L="$P/idris2/bin/idris2"
          python3 - "$L" <<'PY'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          s2 = re.sub(r'^"\$DIR/idris2_app/idris2\.so" "\$@"$', '"${SCHEME:-scheme}" --program "$DIR/idris2_app/idris2.so" "$@"', s, flags=re.M)
          if s2 == s: sys.exit("launcher line not found: inspect bin/idris2")
          open(p, "w").write(s2)
          PY
          cp "$GITHUB_WORKSPACE/toolchain-env.sh" "$P/toolchain-env.sh"
          # runtime libraries: record, and vendor libgmp only if something links it
          mkdir -p "$P/lib"
          ldd "$P/chez/bin/scheme" "$P"/idris2/idris2_app/*.so "$P"/idris2/lib/*.so 2>/dev/null | tee "$P/LDD.txt" || true
          if grep -q libgmp "$P/LDD.txt"; then cp -L "$(ldconfig -p | awk '/libgmp\.so\.10 /{print $NF; exit}')" "$P/lib/"; echo "vendored libgmp"; fi
          objdump -T "$P/chez/bin/scheme" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 > "$P/MIN_GLIBC.txt"

      - name: Relocatability test (clean env, different path, no system scheme)
        run: |
          mkdir -p /tmp/elsewhere && cp -a "$RUNNER_TEMP/tools" /tmp/elsewhere/.tools
          cat > /tmp/elsewhere/Hello.idr <<'IDR'
          module Main
          main : IO ()
          main = putStrLn "toolchain ok"
          IDR
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -c '
            set -e
            ! command -v scheme
            source /tmp/elsewhere/.tools/toolchain-env.sh
            scheme --version
            idris2 --version
            cd /tmp/elsewhere && idris2 Hello.idr -o hello && ./build/exec/hello
          ' 2>&1 | tee "$RUNNER_TEMP/RELOCATION-TEST.txt"
          grep -q "toolchain ok" "$RUNNER_TEMP/RELOCATION-TEST.txt"

      - name: Package
        run: |
          cd "$RUNNER_TEMP/tools"
          { uname -a; lsb_release -ds; ldd --version | head -1; echo "min glibc needed: $(cat MIN_GLIBC.txt)"; echo "chez $CHEZ_TAG idris2 $IDRIS_TAG"; echo; cat "$RUNNER_TEMP/RELOCATION-TEST.txt"; } > BUILD-INFO.txt
          tar -C "$RUNNER_TEMP/tools" -cf - . | xz -9 -T0 > "$RUNNER_TEMP/$BUNDLE.tar.xz"
          cd "$RUNNER_TEMP" && sha256sum "$BUNDLE.tar.xz" > SHA256SUMS && cp tools/BUILD-INFO.txt . && cat SHA256SUMS && ls -la "$BUNDLE.tar.xz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd "$RUNNER_TEMP"
          gh release create "$TAG" "$BUNDLE.tar.xz" SHA256SUMS BUILD-INFO.txt --repo "$GITHUB_REPOSITORY" \
            --title "Linux x86_64 toolchain ($TAG)" --notes-file BUILD-INFO.txt \
            || gh release upload "$TAG" "$BUNDLE.tar.xz" SHA256SUMS BUILD-INFO.txt --clobber --repo "$GITHUB_REPOSITORY"
